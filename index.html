<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title> </title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;min-height:100%;overflow:hidden;background:#071725}
body{display:flex;align-items:center;justify-content:center;padding:12px}
.preview{position:relative;width:min(100%,760px);height:min(100%,900px);aspect-ratio:3/4;overflow:hidden;border-radius:22px;background:#071725;display:grid;place-items:center}
.preview video{display:block;width:100%;height:100%;object-fit:cover;background:#071725}
.shade{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.frame{width:min(72vw,340px);aspect-ratio:1;border:3px solid #62c7ff;border-radius:24px;box-shadow:0 0 0 999px rgba(0,0,0,.12),0 0 24px #168bfa66}
</style>
</head>
<body>
<div class="preview">
  <video id="camera" autoplay muted playsinline></video>
  <div class="shade"><div class="frame" aria-hidden="true"></div></div>
</div>
<script>
(function(){
  'use strict';
  const nonce=new URLSearchParams(location.search).get('nonce')||'';
  const video=document.getElementById('camera');
  let stream=null,timer=null,finished=false;
  function stop(){
    if(timer){clearTimeout(timer);timer=null;}
    if(stream){stream.getTracks().forEach(track=>{try{track.stop();}catch(e){}});stream=null;}
    try{video.pause();video.srcObject=null;}catch(e){}
  }
  function send(status,message){
    if(finished)return;
    finished=true;
    stop();
    try{
      if(window.opener&&!window.opener.closed){
        window.opener.postMessage({type:'MYBANK_CAMERA_BRIDGE',nonce:nonce,status:status,message:message||''},'*');
      }
    }catch(e){}
    if(status==='success')setTimeout(()=>{try{window.close();}catch(e){}},100);
  }
  async function start(){
    if(!nonce){send('error','ลิงก์เปิดกล้องไม่ถูกต้อง');return;}
    if(!navigator.mediaDevices||typeof navigator.mediaDevices.getUserMedia!=='function'){
      send('error','เบราว์เซอร์ไม่รองรับการเปิดกล้องสด');return;
    }
    try{
      stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});
      video.srcObject=stream;
      await video.play();
      timer=setTimeout(()=>send('success',''),4000);
    }catch(err){
      let message='ไม่สามารถเปิดกล้องได้';
      if(err&&err.name==='NotAllowedError')message='กรุณาอนุญาตสิทธิ์ Camera สำหรับเว็บไซต์นี้';
      else if(err&&err.name==='NotFoundError')message='ไม่พบกล้องในอุปกรณ์';
      else if(err&&err.name==='NotReadableError')message='กล้องกำลังถูกใช้งานโดยแอปอื่น';
      send('error',message);
    }
  }
  window.addEventListener('pagehide',stop,{once:true});
  start();
})();
</script>
</body>
</html>
